
{% extends "base.html" %}

{% block title %}{{ titulo }} · OneNova{% endblock %}

{% block content %}
<div class="container-fluid py-4">

    <div class="mb-4">
        <h2 class="fw-bold">{{ titulo }}</h2>
        <p class="text-muted">Introduce los datos del proveedor.</p>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">

            <form method="post">
                {% csrf_token %}

                {% for campo in formulario %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            {{ campo.label }}
                        </label>

                        {{ campo }}

                        {% if campo.errors %}
                            <div class="text-danger small mt-1">
                                {{ campo.errors }}
                            </div>
                        {% endif %}
                    </div>
                {% endfor %}

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary">
                        Guardar proveedor
                    </button>

                    <a href="{% url 'gestion:proveedores' %}"
                       class="btn btn-outline-secondary">
                        Cancelar
                    </a>
                </div>

            </form>

        </div>
    </div>

</div>
{% endblock %}
