{% load static %}
<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Acceso · OneNova</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="{% static 'css/style.css' %}" rel="stylesheet"></head>
<body class="login-body"><div class="login-card"><a class="brand login-brand" href="#"><span class="brand-mark">O</span><span>OneNova<small>GESTIÓN INTELIGENTE</small></span></a><div class="eyebrow mt-5">BIENVENIDO DE NUEVO</div><h1>Inicia sesión<span class="heading-period">.</span></h1><p class="subtitle mb-4">Accede a tu espacio de trabajo.</p>{% if form.errors %}<div class="alert alert-danger">Usuario o contraseña incorrectos. Inténtalo de nuevo.</div>{% endif %}<form method="post">{% csrf_token %}<div class="mb-3"><label class="form-label" for="id_username">Usuario</label><input class="form-control" id="id_username" name="username" autocomplete="username" required autofocus></div><div class="mb-4"><label class="form-label" for="id_password">Contraseña</label><input class="form-control" id="id_password" name="password" type="password" autocomplete="current-password" required></div><button class="btn btn-dark w-100 py-2" type="submit">Entrar en OneNova →</button></form><p class="login-foot">Acceso local · Proyecto en desarrollo</p></div></body></html>
